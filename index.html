<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Globing — Itinerary Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Globing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ TRIP LIST VIEW ============ -->
  <section id="view-trips" class="view">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✈</span>
        <h1>Globing</h1>
      </div>
      <button id="btn-export" class="icon-btn" title="Export backup" aria-label="Export backup">⭳</button>
      <input type="file" id="import-file" accept="application/json" hidden>
      <button id="btn-import" class="icon-btn" title="Import backup" aria-label="Import backup">⭱</button>
    </header>

    <div class="scroll-area">
      <div id="trip-list" class="trip-list"></div>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">No trips yet</p>
        <p class="empty-sub">Start one below — every leg, every ticket, hour by hour.</p>
      </div>

      <button id="btn-new-trip" class="btn-new-trip">+ New trip</button>
    </div>
  </section>

  <!-- ============ CREATE TRIP VIEW ============ -->
  <section id="view-new-trip" class="view" hidden>
    <header class="topbar">
      <button id="btn-cancel-new-trip" class="icon-btn" aria-label="Back to trips">←</button>
      <div class="trip-heading">
        <h1>New trip</h1>
      </div>
    </header>

    <div class="scroll-area">
      <form id="form-new-trip" class="card form-card">
        <label class="field">
          <span>Trip name</span>
          <input type="text" id="input-trip-name" placeholder="e.g. Japan, spring loop" required>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Departs</span>
            <input type="date" id="input-trip-start" required>
          </label>
          <label class="field">
            <span>Returns</span>
            <input type="date" id="input-trip-end" required>
          </label>
        </div>
        <button type="submit" class="btn-primary">Create trip</button>
      </form>
    </div>
  </section>

  <!-- ============ TRIP DETAIL VIEW ============ -->
  <section id="view-trip" class="view" hidden>
    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Back to trips">←</button>
      <div class="trip-heading">
        <h1 id="trip-title">Trip</h1>
        <p id="trip-dates" class="trip-dates"></p>
      </div>
      <button id="btn-trip-menu" class="icon-btn" aria-label="Trip settings">⋯</button>
    </header>

    <!-- Trip settings drawer: destinations, tickets, dates -->
    <div id="trip-drawer" class="drawer" hidden>
      <div class="drawer-inner">
        <section class="drawer-section">
          <p class="drawer-label">Travel period</p>
          <div class="field-row">
            <label class="field">
              <span>Departs</span>
              <input type="date" id="edit-trip-start">
            </label>
            <label class="field">
              <span>Returns</span>
              <input type="date" id="edit-trip-end">
            </label>
          </div>
          <label class="field">
            <span>Trip name</span>
            <input type="text" id="edit-trip-name">
          </label>
        </section>

        <section class="drawer-section">
          <p class="drawer-label">Destinations</p>
          <div id="destination-chips" class="chip-row"></div>
          <div class="add-row">
            <input type="text" id="input-destination" placeholder="Add a destination">
            <button id="btn-add-destination" class="btn-small">Add</button>
          </div>
        </section>

        <section class="drawer-section">
          <p class="drawer-label">Tickets &amp; bookings</p>
          <p class="drawer-hint">Flights, hotels, rail passes — anything not tied to one time slot.</p>
          <div id="ticket-list" class="ticket-list"></div>
          <div class="add-row add-row-stacked">
            <input type="text" id="input-ticket-label" placeholder="e.g. Flight AC003, hotel confirmation">
            <input type="text" id="input-ticket-detail" placeholder="Reference / seat / notes">
            <button id="btn-add-ticket" class="btn-small">Add</button>
          </div>
        </section>

        <button id="btn-delete-trip" class="btn-danger">Delete this trip</button>
      </div>
    </div>

    <div id="day-tabs" class="day-tabs"></div>

    <div class="scroll-area">
      <div id="day-view" class="day-view"></div>
    </div>
  </section>

</div>

<input type="file" id="attach-file-input" accept="image/*,application/pdf" hidden>

<script src="app.js"></script>
</body>
</html>
